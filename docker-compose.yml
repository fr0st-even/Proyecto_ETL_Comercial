services:
  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas requests sqlalchemy psycopg2-binary openpyxl"
      AIRFLOW_CONN_NEON_OPERACIONAL: ${NEON_OPERACIONAL_URI}
      AIRFLOW_CONN_NEON_DW: ${NEON_DW_URI}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs